# Release — form per EVANS_CONFIG_FORMAT, semantics per EVANS_GITHUB_ACTIONS.
# The App Store lane: a macOS runner generates the Xcode project (XcodeGen),
# archives with cloud-managed signing, and uploads to App Store Connect.
# Xcode is in the loop here on purpose — ASC bundle validation requires the
# DT* toolchain keys and the compiled Assets.car icon, which only Xcode
# produces (docs/XTOOL.md, "Distribution"). Development stays Linux + xtool.
#
# Trigger is manual only; each run's build number is the workflow run number.
# Secrets required: ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY (the .p8 body).
---
name: release
on:
  workflow_dispatch:

permissions:
  contents: read                       # least privilege; no job here writes

concurrency:
  group: release                       # one upload at a time; never cancel one
                                       # mid-flight, later runs queue behind it

jobs:
  upload:
    name: archive-and-upload
    runs-on: macos-26                  # Xcode 26 / iOS 26 SDK, the floor Apple
                                       # enforces for store uploads since 2026-04
    timeout-minutes: 60
    steps:
      - name: Check out the tree
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false   # no later step pushes

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Materialize the App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          if [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "ASC_PRIVATE_KEY secret is not set" >&2
            exit 1
          fi
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project Deltarium.xcodeproj \
            -scheme Deltarium \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Deltarium.xcarchive" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Deltarium.xcarchive" \
            -exportOptionsPlist .github/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Scrub the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
