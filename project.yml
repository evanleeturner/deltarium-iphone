# XcodeGen spec for the App Store release lane ONLY. Day-to-day development
# stays on Linux via xtool (App/xtool.yml); this file exists so the macOS
# release runner can generate a real .xcodeproj, because App Store validation
# requires two things only Xcode produces: the DT* toolchain Info.plist keys
# and the compiled Assets.car app icon. The generated Deltarium.xcodeproj and
# App/Support/Info-store.plist are runner artifacts, gitignored.
#
# The app target compiles App/Sources/EasyModelerApp directly (the @main app
# lives there); EasyModelerKit stays a local SwiftPM package dependency.
name: Deltarium
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  EasyModelerKit:
    path: EasyModelerKit
targets:
  Deltarium:
    type: application
    platform: iOS
    sources:
      - App/Sources/EasyModelerApp
      - App/Assets.xcassets
    dependencies:
      - package: EasyModelerKit
    info:
      path: App/Support/Info-store.plist
      properties:
        CFBundleDisplayName: Deltarium
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evanleeturner.easymodeler
        PRODUCT_NAME: Deltarium
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1  # overridden per run with the CI run number
        DEVELOPMENT_TEAM: 5GNLC92RK8
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"  # iPhone; the store then wants iPhone shots only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Deltarium:
    build:
      targets:
        Deltarium: all
    archive:
      config: Release
